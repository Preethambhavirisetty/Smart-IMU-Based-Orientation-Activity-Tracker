[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imu-orientation-activity-tracker"
version = "0.1.0"
description = "Smart IMU-based orientation and activity tracker with filtering, sensor fusion, detection, and visualization."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "IMU Tracker" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
  "types-pyserial>=3.5",
]

[project.scripts]
imu-tracker = "imu_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
